name: MLOps CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas scikit-learn fastapi pytest pydantic pyyaml httpx

      - name: Check project structure
        run: |
          ls -la
          ls src/
          ls fastapi_app/

      - name: Lint check
        run: |
          pip install flake8
          flake8 src/ fastapi_app/ --max-line-length=120 --ignore=E501,W503 || true

      - name: Test API health
        run: |
          pytest tests/ -v || true